{% set seo_title = "Gym Cardio Workout | VitalLog" %}
{% set noindex = True %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% include "_seo.html" %}
</head>
<body>
<div class="navbar">
    <a href="/">Dashboard</a>
    <a href="/food">Food</a>
    <a href="/report">Report</a>
</div>

<h1>Log Cardio / Non-Gym Activity</h1>

<form method="POST">

    <label for="activity">Activity:</label><br>
    <select id="activity" name="activity" required>
        <option>Walking</option>
        <option>Running</option>
        <option>Cycling</option>
        <option>Jump Rope</option>
        <option>Core / Abs Circuit</option>
    </select>
    <br><br>

    <label for="minutes">Duration (minutes):</label><br>
    <input type="number" step="0.5" id="minutes" name="minutes" required>
    <br><br>

    <label for="calories">Calories Burned:</label><br>
    <input type="number" step="0.5" id="calories" name="calories" required>
    <br><br>

    <button type="submit">Add Cardio</button>

</form>

<hr>
<a href="/">Back to Dashboard</a>

</body>
</html>
